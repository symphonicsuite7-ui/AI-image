server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ai-image-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_image?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:257774050}
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

image:
  api-key: ${IMAGE_API_KEY:sk-a7e208f3ad68cc00effe3a67bd0b11ea1e0b35d4d49cba564b60c0967782dddc}
  base-url: ${IMAGE_BASE_URL:https://api.zyuou.com/v1/images/generations}
  edit-url: ${IMAGE_EDIT_URL:https://api.zyuou.com/v1/images/edits}
  edit-api-key: ${IMAGE_EDIT_API_KEY:${IMAGE_API_KEY:sk-a7e208f3ad68cc00effe3a67bd0b11ea1e0b35d4d49cba564b60c0967782dddc}}
  model: ${IMAGE_MODEL:gpt-image-2.5}
  upload-dir: ${IMAGE_UPLOAD_DIR:uploads/images}
  public-path: /uploads/images
  connect-timeout: 15s
  read-timeout: 3m
  max-image-bytes: ${IMAGE_MAX_BYTES:26214400}
  max-upload-bytes: ${IMAGE_MAX_UPLOAD_BYTES:20971520}
